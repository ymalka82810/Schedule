name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # הבדיקות רצות לפני הבנייה: אם פענוח נשבר, האתר לא מתעדכן
      - run: npm test
      - run: npm run build
        env:
          # כתובת שרת Convex (ציבורית, לא סוד). מוגדרת ב-Settings > Variables של הריפו
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
